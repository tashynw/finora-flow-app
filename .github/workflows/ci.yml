name: CI

on:
  push:
    branches: [main]
  pull_request:

# A financial approval system cannot rely on a green tick that only means
# "nothing crashed". Every job below is a merge gate.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify generated API types are current
        # The committed types are generated from the API schema. If they are
        # stale, the browser is compiled against a contract the API no longer
        # honours, and the mismatch would only appear at runtime.
        run: |
          pnpm --filter @finora/shared-types generate
          git diff --exit-code -- packages/shared-types/src/generated \
            || { echo "::error::Run 'pnpm schema:generate' and commit the result."; exit 1; }

      - name: Lint
        run: pnpm --filter @finora/web lint

      - name: Typecheck
        run: pnpm --filter @finora/web typecheck

      - name: Unit and component tests
        run: pnpm --filter @finora/web test

      - name: Build
        run: pnpm --filter @finora/web build

  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: finora
          POSTGRES_PASSWORD: finora_ci_only
          POSTGRES_DB: finora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      FINORA_ENVIRONMENT: development
      FINORA_DB_HOST: localhost
      FINORA_DB_PORT: "5432"
      FINORA_DB_USER: finora
      FINORA_DB_PASSWORD: finora_ci_only
      FINORA_DB_NAME: finora
      FINORA_REDIS_HOST: localhost
      FINORA_REDIS_PORT: "6379"
      FINORA_AUTH_LINK_SIGNING_KEY: ci_signing_key_not_used_in_any_deployment
      FINORA_AUTH_ALLOW_LOCAL_ACCOUNTS: "true"

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Typecheck
        run: mypy src

      - name: Migrate
        run: alembic upgrade head

      - name: Verify migrations match the models
        # An autogenerate that still has something to say means a model changed
        # without a migration, so production and the ORM would disagree.
        run: alembic check

      - name: Verify the committed OpenAPI schema matches the routes
        run: python scripts/export_openapi.py --check

      - name: Tests
        run: pytest

  visual:
    name: Visual regression and accessibility
    runs-on: ubuntu-latest

    # The whole stack, because these tests drive the real product. A screenshot of
    # a mocked screen passes while the thing it depicts is broken, which is the
    # failure this gate exists to catch: the encrypted-write fault against the
    # object store was found here and by nothing else.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: finora
          POSTGRES_PASSWORD: finora_ci_only
          POSTGRES_DB: finora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: finora_ci_access
          MINIO_ROOT_PASSWORD: finora_ci_only
          # The API asks for server-side encryption on every write and MinIO
          # refuses an encrypted write with no key service configured, so without
          # this nothing can be stored and every upload fails.
          MINIO_KMS_SECRET_KEY: finora-ci-key:PGgQ0Xm5cE3XkxWXm3vHTF6q1sZ8mQeMcLPPFV0MTMs=
        ports: ["9000:9000"]
        options: >-
          --health-cmd "mc ready local"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

      clamav:
        image: clamav/clamav:stable
        ports: ["3310:3310"]
        # Slow to become ready: it loads the signature database before it will
        # accept a scan. Waited out rather than skipped, because an upload that
        # cannot be scanned is quarantined, and a suite that tolerated that would
        # be asserting the failure mode instead of the behaviour.
        options: >-
          --health-cmd "clamdcheck"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 40
          --health-start-period 120s

    env:
      FINORA_ENVIRONMENT: development
      FINORA_DB_HOST: localhost
      FINORA_DB_PORT: "5432"
      FINORA_DB_USER: finora
      FINORA_DB_PASSWORD: finora_ci_only
      FINORA_REDIS_HOST: localhost
      FINORA_REDIS_PORT: "6379"
      FINORA_AUTH_LINK_SIGNING_KEY: ci_signing_key_not_used_in_any_deployment
      FINORA_AUTH_ALLOW_LOCAL_ACCOUNTS: "true"
      FINORA_S3_ENDPOINT_URL: http://localhost:9000
      FINORA_S3_ACCESS_KEY: finora_ci_access
      FINORA_S3_SECRET_KEY: finora_ci_only
      FINORA_SCANNER_HOST: localhost
      FINORA_SCANNER_PORT: "3310"

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install API dependencies
        working-directory: apps/api
        run: uv pip install --system -e ".[dev]"

      - name: Create object storage buckets
        # Versioning is enabled because originals are write-once; the API refuses
        # to overwrite one, and versioning is what makes that verifiable after the
        # fact rather than only enforced in code.
        env:
          AWS_ACCESS_KEY_ID: finora_ci_access
          AWS_SECRET_ACCESS_KEY: finora_ci_only
          AWS_DEFAULT_REGION: us-east-1
        run: |
          for bucket in finora-raw-messages finora-documents finora-quarantine finora-exports; do
            aws --endpoint-url http://localhost:9000 s3api create-bucket --bucket "$bucket"
            aws --endpoint-url http://localhost:9000 s3api put-bucket-versioning \
              --bucket "$bucket" --versioning-configuration Status=Enabled
          done

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm --filter @finora/web exec playwright install --with-deps chromium

      - name: Visual regression and accessibility
        # The API is on the system interpreter here, not in a virtual environment.
        env:
          FINORA_API_PYTHON: python
        run: pnpm --filter @finora/web test:visual

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            apps/web/playwright-report
            apps/web/tests/visual/.output
          retention-days: 14

  security:
    name: Security gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install API dependencies
        working-directory: apps/api
        run: uv pip install --system -e ".[dev]"

      - name: Static security analysis
        working-directory: apps/api
        run: bandit -c pyproject.toml -r src

      - name: Python dependency advisories
        working-directory: apps/api
        # `--strict` is deliberately omitted: it would fail on the local
        # editable package, which is not on PyPI. Real advisories still fail.
        run: pip-audit --skip-editable

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: JavaScript dependency advisories
        # Moderate and above fails. A known-vulnerable transitive package is
        # not acceptable in a system that handles payment instructions.
        run: pnpm audit --audit-level moderate

      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-bar:
    name: Release bar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: No unresolved gates on a critical path
        # The master prompt forbids shipping placeholder screens, fake success
        # and TODO gates. This catches the markers rather than trusting review.
        run: |
          if grep -rnE '\b(TODO|FIXME|XXX|HACK)\b' \
                  --include='*.ts' --include='*.tsx' \
                  --include='*.py' --include='*.sql' \
                  apps/ packages/; then
            echo "::error::Unresolved marker found. Resolve it or move it to a tracked issue before merging."
            exit 1
          fi
          echo "No unresolved markers."

[project]
name = "finora-api"
version = "0.1.0"
description = "Finora Flow - Unified Invoice and Estimate Automation Platform API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.11",
    "pydantic-settings>=2.11",
    "sqlalchemy>=2.0.44",
    "alembic>=1.17",
    "psycopg[binary,pool]>=3.2",
    "redis>=6.4",
    "boto3>=1.41",
    # OIDC ID-token validation. PyJWT verifies through `cryptography` rather
    # than the pure-Python `ecdsa`, which is not constant-time and carries an
    # unfixed advisory. See docs/adr/0004-pyjwt-not-python-jose.md.
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    # Multipart parsing for document upload. FastAPI needs it present to accept
    # a file at all.
    "python-multipart>=0.0.20",
    "structlog>=25.4",
    "email-validator>=2.3",
    "itsdangerous>=2.2",
    "openpyxl>=3.1",
    # Text and word geometry from a PDF's own text layer. The geometry is what
    # makes field evidence exact: a value can be pointed at on the page rather
    # than merely asserted. Chosen over a plain text extractor for that reason.
    "pdfplumber>=0.11",
    # Renders a page to an image for the vision path, used only when a document
    # has no text layer to read.
    "pypdfium2>=5.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7.0",
    "ruff>=0.14",
    "mypy>=1.18",
    "testcontainers>=4.13",
    "bandit>=1.9",
    "pip-audit>=2.9",
    # Typed S3 calls. Without stubs, every boto3 result is `Any` and a wrong
    # parameter name on a storage write only shows up at runtime.
    "boto3-stubs[s3]>=1.41",
]
# Only needed on a workstation behind a TLS-inspecting proxy, where the
# re-signed certificate chain is trusted by Windows but not by certifi. Not
# installed in CI, which reaches PyPI directly.
tls-proxy = [
    "pip-system-certs>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finora"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle, pyflakes
    "I",                # import sorting
    "N",                # naming
    "UP",               # pyupgrade
    "B",                # bugbear
    "S",                # bandit security rules
    "A",                # builtin shadowing
    "DTZ",              # naive datetime usage
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# `assert` is removed under `python -O`, so it must never carry a control or
# security decision in production code. Tests are the one place it belongs.
"tests/**" = ["S101", "S105", "S106"]
# FastAPI dependency defaults; camelCase badge keys match the web contract.
"src/finora/api/routers/credit_cards.py" = ["B008"]
"src/finora/api/routers/work.py" = ["N815"]
# Dev-only scripts favour readable one-line data tables over the line limit.
"scripts/**" = ["S101", "S110", "E501"]
"alembic/**" = ["E501"]
"src/finora/application/accruals.py" = ["A002"]
"src/finora/application/credit_cards.py" = ["S101"]
"src/finora/domain/credit_cards.py" = ["S101"]

[tool.bandit]
# Test asserts and hard-coded local fixtures are not production findings.
exclude_dirs = ["tests", ".venv"]
# B101: asserts that only guard programmer errors (stripped under -O).
# B105/B106: empty-string defaults mistaken for passwords.
# B110: deliberate pass on best-effort cleanup paths.
skips = ["B101", "B105", "B106", "B110"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

# Neither document library ships type information. They are confined to
# `infrastructure/document_text.py` and `infrastructure/page_render.py`, which
# convert their results into the typed domain model at once, so the untyped
# surface does not reach anything else.
[[tool.mypy.overrides]]
module = ["pdfplumber.*", "pypdfium2.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: requires the docker compose dependency stack",
]

[tool.coverage.run]
source = ["src/finora"]
branch = true
